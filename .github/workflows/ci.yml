name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type-check main process and engine
        run: npx tsc -p .
      - name: Type-check renderer
        run: npx tsc --noEmit -p renderer
      - name: Engine unit tests
        run: node --test export/test/
      - name: Validate translations
        run: node scripts/validate-schema.js
      - name: Build renderer
        run: npx next build renderer
